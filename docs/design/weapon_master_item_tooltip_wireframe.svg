<rect x="168" y="242" width="60" height="24" rx="12" class="badge"/>
<text x="198" y="258" font-size="10" text-anchor="middle">槍</text>

<rect x="24" y="278" width="100" height="26" rx="13" class="highlight"/>
<text x="74" y="295" font-size="11" text-anchor="middle">ブロック</text>
</svg>
