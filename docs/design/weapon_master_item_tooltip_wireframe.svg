<rect x="192" y="88" width="164" height="24" rx="4" class="box"/>
<text x="200" y="104" font-size="10">使用間隔: 2.4秒</text>

<rect x="24" y="116" width="160" height="24" rx="4" class="box"/>
<text x="32" y="132" font-size="10">奥義ゲージ獲得量: 2</text>

