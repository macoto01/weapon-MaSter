<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:sans-serif;fill:#2c2c2a}
.th{font-weight:600}
.card{fill:#ffffff;stroke:#7F77DD}
.header{fill:#F1EFE8}
.star{fill:#2c2c2a}
.infoIcon{fill:#ffffff;stroke:#4B4FCB}
.box{fill:#F1EFE8}
.badge{fill:#F1EFE8;stroke:#b4b2a9}
.highlight{fill:#E1F5EE;stroke:#1D9E75}
</style>

<rect x="10" y="10" width="360" height="300" rx="8" class="card"/>

<rect x="10" y="10" width="360" height="46" rx="8" class="header"/>
<text x="28" y="38" class="th" font-size="15">エデン</text>
<circle cx="240" cy="33" r="6" class="star"/>
<circle cx="256" cy="33" r="6" class="star"/>
<circle cx="272" cy="33" r="6" class="star"/>
<circle cx="288" cy="33" r="6" class="star"/>
<circle cx="304" cy="33" r="6" class="star"/>
<circle cx="332" cy="33" r="11" class="infoIcon"/>
<text x="332" y="37" font-size="10" text-anchor="middle">i</text>

<rect x="24" y="60" width="160" height="24" rx="4" class="box"/>
<text x="32" y="76" font-size="10">ダメージ: 7-12</text>
<rect x="192" y="60" width="164" height="24" rx="4" class="box"/>
<text x="200" y="76" font-size="10">スタミナ消費量: 1.4</text>

<rect x="24" y="88" width="160" height="24" rx="4" class="box"/>
