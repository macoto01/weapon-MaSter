<svg width="100%" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:sans-serif;fill:#2c2c2a}
.th{font-weight:600}
.gray{fill:#F1EFE8;stroke:#888780}
.grayDashed{fill:#F1EFE8;stroke:#888780;stroke-dasharray:4 3}
.purple{fill:#EEEDFE;stroke:#7F77DD}
.teal{fill:#E1F5EE;stroke:#1D9E75}
.coral{fill:#FAECE7;stroke:#D85A30}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="90" y="30" width="140" height="56" rx="8" class="gray"/>
<text x="160" y="53" text-anchor="middle">あそびかた</text>
<text x="160" y="71" text-anchor="middle" font-size="11">ポップアップ表示</text>

<rect x="270" y="30" width="140" height="44" rx="8" class="purple"/>
<text x="340" y="56" text-anchor="middle">タイトル画面</text>

<rect x="470" y="30" width="140" height="44" rx="8" class="teal"/>
<text x="540" y="56" text-anchor="middle">図鑑画面</text>

<line x1="270" y1="52" x2="232" y2="52" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="52" x2="468" y2="52" class="arr" marker-end="url(#arrow)"/>
<path d="M540 74 C 540 100, 340 100, 340 76" class="arr" marker-end="url(#arrow)"/>
<text x="440" y="98" text-anchor="middle" font-size="11">戻る</text>
<line x1="340" y1="74" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>
<text x="340" y="112" text-anchor="middle" font-size="11">ランクマッチ / カジュアルマッチ</text>

<rect x="270" y="140" width="140" height="56" rx="8" class="purple"/>
<text x="340" y="163" text-anchor="middle">バトル準備画面</text>
<text x="340" y="181" text-anchor="middle" font-size="11">ショップ・配置</text>

<line x1="340" y1="196" x2="340" y2="214" class="arr" marker-end="url(#arrow)"/>

<rect x="255" y="216" width="170" height="50" rx="8" class="grayDashed"/>
<text x="340" y="237" text-anchor="middle">合成確認</text>
<text x="340" y="254" text-anchor="middle" font-size="11">(合成候補がある場合のみ)</text>

<line x1="340" y1="266" x2="340" y2="294" class="arr" marker-end="url(#arrow)"/>
<text x="358" y="284" text-anchor="start" font-size="11">はい</text>

<path d="M255 241 C 180 241, 180 168, 268 168" class="arr" marker-end="url(#arrow)"/>
<text x="178" y="208" text-anchor="middle" font-size="11">いいえ</text>

<rect x="270" y="296" width="140" height="56" rx="8" class="coral"/>
<text x="340" y="319" text-anchor="middle">バトル画面</text>
<text x="340" y="337" text-anchor="middle" font-size="11">対戦実行</text>

<path d="M410 324 C 560 324, 560 272, 560 272" class="arr"/>
<rect x="485" y="216" width="150" height="56" rx="8" class="grayDashed"/>
<text x="560" y="239" text-anchor="middle">バトル結果</text>
<text x="560" y="256" text-anchor="middle" font-size="11">勝敗・ライフ表示</text>
<path d="M560 216 C 560 168, 560 168, 412 168" class="arr" marker-end="url(#arrow)"/>
<text x="560" y="203" text-anchor="middle" font-size="11">終了後</text>
</svg>
