<svg viewBox="0 0 580 700" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:sans-serif;fill:#2c2c2a}
.th{font-weight:600}
.panel{fill:#ffffff;stroke:#b4b2a9}
.logo{fill:none;stroke:#b4b2a9;stroke-dasharray:4 4}
.btn{fill:#EEEEFC;stroke:#4B4FCB}
.btnAlt{fill:#EEEDFE;stroke:#7F77DD}
.badge{fill:#FAEEDA;stroke:#BA7517}
</style>

<rect x="10" y="10" width="560" height="680" rx="4" class="panel"/>

<rect x="140" y="120" width="300" height="120" rx="4" class="logo"/>
<text x="290" y="185" class="th" font-size="16" text-anchor="middle">ウエポンマスター</text>
<text x="290" y="210" font-size="10" text-anchor="middle">タイトルロゴ</text>

<rect x="165" y="300" width="250" height="60" rx="30" class="btn"/>
<text x="290" y="337" font-size="16" text-anchor="middle">ランクマッチ</text>

<rect x="165" y="380" width="250" height="60" rx="30" class="btn"/>
<text x="290" y="417" font-size="16" text-anchor="middle">カジュアルマッチ</text>

<rect x="165" y="460" width="250" height="60" rx="30" class="btnAlt"/>
<text x="290" y="497" font-size="16" text-anchor="middle">図鑑</text>

<circle cx="500" cy="620" r="40" fill="#ffffff" stroke="#BA7517" stroke-width="2"/>
<text x="500" y="624" font-size="12" text-anchor="middle">あそび</text>
<text x="500" y="638" font-size="12" text-anchor="middle">かた</text>

<text x="290" y="670" font-size="10" text-anchor="middle">バージョン表記など(想定)</text>
</svg>
